name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: relay-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --audit-level high
      - run: pnpm exec playwright install --with-deps chromium
      - run: cp .env.example .env && make dev && make seed
      - run: make test:e2e
      - name: Container logs on failure
        if: failure()
        run: |
          if test -f .env; then
            docker compose --project-name relay-dev --env-file .env -f infra/docker/compose.dev.yml --profile e2e logs --no-color --tail 100
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore

  production-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --target runtime -f infra/docker/api.Dockerfile -t relay-api:ci .
      - run: docker build -f infra/docker/nginx.Dockerfile -t relay-nginx:ci .
      - run: docker build -f infra/docker/minio.Dockerfile -t relay-minio:ci .
      - run: sh infra/scripts/init-local-production.sh && docker compose --env-file .env.production -f infra/docker/compose.prod.yml config --quiet
