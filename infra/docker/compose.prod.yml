name: relay-prod

x-runtime: &runtime
  build: { context: ../.., dockerfile: infra/docker/api.Dockerfile, target: runtime }
  env_file: [../../.env.production]
  init: true
  restart: unless-stopped
  stop_grace_period: 40s
  deploy:
    replicas: 2
    resources:
      limits: { cpus: '1.0', memory: 512M }
  depends_on:
    mongo-init: { condition: service_completed_successfully }
    redis: { condition: service_healthy }
    kafka-init: { condition: service_completed_successfully }
    minio-init: { condition: service_completed_successfully }
  healthcheck:
    test:
      [
        CMD,
        node,
        -e,
        'fetch("http://localhost:3000/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
      ]
    interval: 15s
    timeout: 8s
    retries: 6
    start_period: 25s

services:
  mongo:
    extends: { file: services.yml, service: mongo }
    restart: unless-stopped
    mem_limit: 1g
    cpus: '1.5'
  mongo-init: { extends: { file: services.yml, service: mongo-init } }
  redis:
    extends: { file: services.yml, service: redis }
    restart: unless-stopped
    mem_limit: 384m
    cpus: '0.75'
  kafka:
    extends: { file: services.yml, service: kafka }
    restart: unless-stopped
    mem_limit: 1g
    cpus: '1.5'
  kafka-init: { extends: { file: services.yml, service: kafka-init } }
  minio:
    extends: { file: services.yml, service: minio }
    restart: unless-stopped
    mem_limit: 768m
    cpus: '1.0'
  minio-init: { extends: { file: services.yml, service: minio-init } }
  api:
    <<: *runtime
    environment: { APP_ROLE: gateway, PORT: '3000' }
  worker:
    <<: *runtime
    environment: { APP_ROLE: worker, PORT: '3000' }
  tls-init:
    image: alpine:3.22.2
    entrypoint:
      [
        sh,
        -ec,
        'cp /input/fullchain.pem /tls/fullchain.pem && cp /input/privkey.pem /tls/privkey.pem && chown 101:101 /tls/*.pem && chmod 400 /tls/*.pem',
      ]
    volumes:
      - type: bind
        source: ${RELAY_TLS_DIR:-../../.relay-tls}
        target: /input
        read_only: true
        bind: { create_host_path: false }
      - tls-data:/tls
  nginx:
    build: { context: ../.., dockerfile: infra/docker/nginx.Dockerfile }
    environment:
      S3_BUCKET: ${S3_BUCKET:?}
      RELAY_SERVER_NAME: ${RELAY_SERVER_NAME:?}
      RELAY_HTTPS_PUBLIC_PORT: ${RELAY_HTTPS_PUBLIC_PORT:-:8443}
    depends_on:
      api: { condition: service_healthy }
      tls-init: { condition: service_completed_successfully }
    ports:
      [
        '${PUBLIC_BIND:-127.0.0.1}:${HTTP_PORT:-8088}:8080',
        '${PUBLIC_BIND:-127.0.0.1}:${HTTPS_PORT:-8443}:8443',
      ]
    volumes: [tls-data:/tls:ro]
    restart: unless-stopped
    mem_limit: 128m
    cpus: '0.5'
    healthcheck:
      test:
        [CMD, wget, --no-check-certificate, -qO, /dev/null, 'https://127.0.0.1:8443/health/live']
      interval: 10s
      timeout: 5s
      retries: 6
  prometheus:
    image: prom/prometheus:v3.9.1
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=15d']
    volumes:
      - ../../infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    mem_limit: 512m
    cpus: '0.5'
  grafana:
    image: grafana/grafana:12.3.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ../../infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ['127.0.0.1:${GRAFANA_PORT:-3003}:3000']
    restart: unless-stopped
    mem_limit: 384m
    cpus: '0.5'
volumes:
  mongo-data:
  redis-data:
  kafka-data:
  minio-data:
  tls-data:
  prometheus-data:
  grafana-data:
