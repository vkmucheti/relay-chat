services:
  mongo:
    image: mongo:8.0.20
    command: [mongod, --replSet, rs0, --bind_ip_all]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, 'db.adminCommand({ ping: 1 }).ok || quit(1)']
      interval: 5s
      timeout: 5s
      retries: 30
  mongo-init:
    image: mongo:8.0.20
    depends_on:
      mongo: { condition: service_healthy }
    entrypoint: [sh, /scripts/init-replica-set.sh]
    volumes: [../../infra/scripts:/scripts:ro]
  redis:
    image: redis:8.2.2-alpine
    command: [redis-server, --appendonly, 'yes', --appendfsync, always]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '1000'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, 'localhost:9092', --list]
      interval: 10s
      timeout: 8s
      retries: 20
  kafka-init:
    image: apache/kafka:4.1.1
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-6}
      KAFKA_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
    entrypoint: [sh, /scripts/create-kafka-topics.sh]
    volumes: [../../infra/scripts:/scripts:ro]
  minio:
    build: { context: ../.., dockerfile: infra/docker/minio.Dockerfile }
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-relay-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-relay-local-storage}
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ORIGINS:-http://localhost:4200}
    volumes: [minio-data:/data]
    healthcheck:
      test: [CMD, wget, -qO, /dev/null, 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 25
  minio-init:
    build: { context: ../.., dockerfile: infra/docker/api.Dockerfile, target: bucket-init }
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-relay-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-relay-local-storage}
      S3_BUCKET: ${S3_BUCKET:-relay-media}
      S3_ENDPOINT: http://minio:9000

volumes:
  mongo-data:
  redis-data:
  kafka-data:
  minio-data:
